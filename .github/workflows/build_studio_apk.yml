name: Build PixEz Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - studio-redesign

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Flutter (via mise.toml)
        id: setup-flutter
        uses: jdx/mise-action@v2
        continue-on-error: true

      - name: Fallback Setup Flutter
        if: steps.setup-flutter.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate rhttp freezed/g.dart files
        run: |
          if [ -d "plugins/rhttp/rhttp" ]; then
            cd plugins/rhttp/rhttp
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Install dependencies & generate code (.g.dart / .freezed.dart)
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Self-sign Release APKs (fix packageinfo is null)
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v \
            -keystore studio.jks \
            -alias pixezstudio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=PixEzStudio, OU=Dev, O=Personal, L=Tokyo, S=Tokyo, C=JP"

          mkdir -p signed-apks
          for apk in build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$apk" .apk)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "signed-apks/${name}-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks studio.jks --ks-key-alias pixezstudio \
              --ks-pass pass:123456 --key-pass pass:123456 \
              --out "signed-apks/${name}-signed.apk" \
              "signed-apks/${name}-aligned.apk"
            rm -f "signed-apks/${name}-aligned.apk"
          done

      - name: Upload Signed Studio APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixez-studio-android-apk
          path: signed-apks/*-signed.apk
          retention-days: 14
    
