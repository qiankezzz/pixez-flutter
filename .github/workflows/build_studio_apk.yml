name: Build PixEz Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - studio-redesign

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust toolchain (for PixEz native plugins)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Flutter (via mise.toml if present)
        id: setup-flutter
        uses: jdx/mise-action@v2
        continue-on-error: true

      - name: Fallback Setup Flutter
        if: steps.setup-flutter.outcome != 'success'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build split release APKs (arm64-v8a / armeabi-v7a)
        run: flutter build apk --release --split-per-abi

      - name: Upload Studio APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixez-studio-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
